[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veripolicy-rag"
version = "0.1.0"
description = "Version-, scope-, and conflict-aware RAG for enterprise policies"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "JINGYI"}]
dependencies = [
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
ml = [
  "sentence-transformers>=5.0,<6",
  "transformers>=4.51,<6",
  "torch>=2.2",
]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
veripolicy = "veripolicy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

